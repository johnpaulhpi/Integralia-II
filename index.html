<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebrick: an apprenticeship in algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --walnut: #1c130c;
  --walnut-2: #2b1c11;
  --ink: #2a1c0f;
  --ink-soft: #5b4630;
  --parchment: #eadcbc;
  --parchment-2: #d8c59c;
  --brass: #b38b46;
  --brass-hi: #e6c47c;
  --verdigris: #4f8e79;
  --cinnabar: #a3402a;
  --candle: #f5b85c;
  --smoke: #9a8d7c;
  --letterbox: #0d0906;
  --text-lit: #ecd9b1;
  --serif: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --serif-sc: 'IM Fell English SC', 'IM Fell English', 'Palatino Linotype', Georgia, serif;
  --math: 'Cormorant Garamond', 'EB Garamond', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --letterbox: #0d0906; } }
:root[data-theme="dark"] { --letterbox: #0d0906; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --letterbox: #16100b; } }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; height: 100%; background: var(--letterbox); overflow: hidden; font-family: var(--serif); color: var(--text-lit); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

/* ---------- the fixed camera ---------- */
#viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--walnut);
  user-select: none; -webkit-user-select: none; }
#stage::before { /* wood grain + candle pools */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 55% at 50% 58%, rgba(245,184,92,.13), transparent 70%),
    radial-gradient(ellipse 30% 40% at 6% 12%, rgba(245,184,92,.18), transparent 70%),
    repeating-linear-gradient(94deg, rgba(0,0,0,.0) 0 22px, rgba(0,0,0,.12) 22px 23px, rgba(255,210,150,.025) 23px 47px, rgba(0,0,0,.08) 47px 48px),
    linear-gradient(180deg, #0f0a06 0%, #24170d 26%, #2c1d11 60%, #21150c 100%);
}
#stage::after { /* vignette + grain */
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 80;
  background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(0,0,0,.62) 100%);
}
.flicker { position: absolute; inset: 0; pointer-events: none; z-index: 79; background: radial-gradient(ellipse 50% 45% at 8% 10%, rgba(245,184,92,.10), transparent 70%); animation: flick 4.2s infinite steps(1); }
@keyframes flick { 0%{opacity:.9} 12%{opacity:.75} 20%{opacity:1} 43%{opacity:.82} 60%{opacity:.95} 74%{opacity:.7} 88%{opacity:1} }
#scene { position: absolute; inset: 0; }
.shake { animation: shake .5s; }
@keyframes shake { 10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(4px,-2px)} 30%,50%,70%{transform:translate(-6px,2px)} 40%,60%{transform:translate(6px,-1px)} }

/* ---------- math ---------- */
.m { font-family: var(--math); font-weight: 600; font-variant-numeric: lining-nums; white-space: nowrap; }
.m i { font-style: italic; font-weight: 600; padding-right: .04em; }
.m sup { font-size: .62em; vertical-align: .72em; line-height: 0; margin-left: .03em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .1em; line-height: 1.05; }
.fr > .fn { padding: 0 .15em .06em; border-bottom: .07em solid currentColor; font-size: .86em; }
.fr > .fd { padding: .06em .15em 0; font-size: .86em; }
.sq { display: inline-flex; align-items: flex-start; }
.sq .sqs { font-size: 1.05em; margin-right: -.04em; }
.sq .sqr { border-top: .07em solid currentColor; padding: .02em .1em 0 .05em; margin-top: .14em; }
.int { font-size: 1.45em; font-weight: 500; vertical-align: -.2em; margin-right: .06em; font-style: italic; }
.mul { display: inline-block; width: .16em; }
.mf { font-style: normal; }

/* ---------- the Master & his voice ---------- */
.master { position: absolute; left: 50%; top: -14px; width: 250px; margin-left: -125px; z-index: 5; filter: drop-shadow(0 16px 20px rgba(0,0,0,.7)); transition: transform .5s ease; }
.master.lean { transform: translateY(8px) scale(1.04); }
.master-svg { width: 100%; display: block; }
.master .glint { animation: glint 5s infinite; }
@keyframes glint { 0%,70%,100% { opacity: .85 } 76% { opacity: .2 } 82% { opacity: 1 } }
#speech { position: absolute; left: 50%; top: 124px; width: 700px; margin-left: -350px; min-height: 52px; text-align: center; z-index: 60;
  font-size: 19px; line-height: 1.35; color: var(--text-lit); text-shadow: 0 1px 0 #000, 0 0 18px rgba(0,0,0,.9); pointer-events: none; }
#speech b { color: var(--brass-hi); font-weight: normal; }
#speech .m { font-size: 1.05em; color: #f6e7c4; }
#speech em { color: var(--smoke); }
#speech.big { top: 330px; font-size: 24px; width: 820px; margin-left: -410px; }
.tap-hint { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); font-style: italic; color: var(--smoke); font-size: 15px; z-index: 61; animation: breathe 2.4s infinite; }
@keyframes breathe { 50% { opacity: .35 } }

/* ---------- candles ---------- */
.candles { position: absolute; left: 22px; top: 12px; display: flex; gap: 6px; z-index: 6; }
.candle-svg { width: 34px; height: 82px; display: block; }
.candle-svg .flame { transform-origin: 20px 30px; animation: flame 1.8s infinite ease-in-out; }
@keyframes flame { 0%,100% { transform: scale(1) rotate(0) } 30% { transform: scale(1.06,.95) rotate(-2deg) } 60% { transform: scale(.96,1.05) rotate(2deg) } }
.candle-svg .smoke { animation: smoke 3s infinite; }
@keyframes smoke { 0% { opacity: 0; transform: translateY(4px) } 40% { opacity: .6 } 100% { opacity: 0; transform: translateY(-8px) } }

/* ---------- specimen slip ---------- */
.slip { position: absolute; left: 110px; top: 18px; max-width: 330px; padding: 9px 16px 11px; background: var(--parchment); color: var(--ink); transform: rotate(-1.6deg);
  box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 0 22px rgba(120,80,30,.25); z-index: 6; border-radius: 2px; }
.slip::before { content: ''; position: absolute; top: -6px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e9c77f, #6d4c1c); box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.slip .who { font-family: var(--serif-sc); font-size: 13px; color: var(--ink-soft); }
.slip .m { font-size: 22px; display: block; margin-top: 2px; }
.turninfo { position: absolute; right: 22px; top: 18px; text-align: right; z-index: 6; font-size: 15px; color: var(--smoke); line-height: 1.4; }
.turninfo strong { color: var(--text-lit); font-weight: normal; font-family: var(--serif-sc); font-size: 17px; }
.icon-btn { position: absolute; z-index: 70; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--smoke); background: rgba(0,0,0,.35); border: 1px solid rgba(179,139,70,.35); font-size: 15px; }
.icon-btn:hover { color: var(--brass-hi); }

/* ---------- instrument rack ---------- */
.rack { position: absolute; left: 14px; top: 180px; width: 128px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
.tool { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 6px; height: 42px; padding: 0 8px 0 4px; border-radius: 6px; text-align: left;
  color: #d9c7a4; background: linear-gradient(180deg, rgba(62,42,24,.9), rgba(38,25,14,.9)); border: 1px solid #4a3420; box-shadow: 0 2px 4px rgba(0,0,0,.5); font-size: 15px; transition: transform .12s, border-color .12s; }
.tool svg { width: 36px; height: 28px; --tint: var(--brass); color: #e2cca0; }
.tool:hover { transform: translateX(3px); border-color: var(--brass); }
.tool.sel { border-color: var(--brass-hi); background: linear-gradient(180deg, #6a4a24, #3d2813); color: #fff3d6; box-shadow: 0 0 0 1px var(--brass-hi), 0 0 18px rgba(230,196,124,.35); }
.tool.minor { height: 34px; font-size: 14px; color: var(--smoke); background: transparent; border-color: rgba(74,52,32,.7); box-shadow: none; }
.tool.minor svg { height: 22px; }
.rack .gap { height: 6px; }
.hint-pulse { animation: hintp 1.1s infinite; }
@keyframes hintp { 0%,100% { box-shadow: 0 0 0 2px rgba(230,196,124,.9), 0 0 22px rgba(230,196,124,.55); } 50% { box-shadow: 0 0 0 2px rgba(230,196,124,.3), 0 0 6px rgba(230,196,124,.2); } }

/* ---------- the bench ---------- */
.bench { position: absolute; left: 156px; top: 172px; width: 872px; height: 300px; z-index: 8; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 14px 18px; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: #5a4030 transparent; }
.bench.cramped { --cw: 84px; --ch: 118px; --cm: 16px; }
.tray { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: rgba(12,8,5,.34); border: 1px solid rgba(179,139,70,.22); box-shadow: inset 0 2px 10px rgba(0,0,0,.4); }
.tray.targetable { cursor: crosshair; border-color: rgba(230,196,124,.6); }
.tray .sign { position: absolute; left: -14px; top: 50%; transform: translateY(-50%); font-family: var(--math); font-size: 26px; font-weight: 700; color: var(--brass-hi); }
.coef { min-width: 44px; height: 44px; padding: 0 6px; border-radius: 22px; display: grid; place-items: center; color: #2b1a0a; font-size: 19px;
  background: radial-gradient(circle at 35% 30%, #f2d894, #b38b46 60%, #7a5a26); box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 -2px 3px rgba(0,0,0,.3); }
.coef .m { font-weight: 700; }
.card { --cw: 104px; --ch: 146px; --cm: 20px; position: relative; width: var(--cw); height: var(--ch); border-radius: 7px; background: var(--parchment); color: var(--ink);
  box-shadow: 0 5px 10px rgba(0,0,0,.55), inset 0 0 18px rgba(120,80,30,.22); display: flex; flex-direction: column; align-items: center; padding: 6px 5px 5px; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease; flex: none; }
.bench.cramped .card { --cw: 86px; --ch: 122px; --cm: 16px; }
.card::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(60,40,20,.45); border-radius: 5px; pointer-events: none; }
.card .c-name { font-family: var(--serif-sc); font-size: 12px; line-height: 1.05; text-align: center; min-height: 13px; color: var(--ink); }
.card .c-art { width: 100%; height: 42px; margin: 2px 0; color: var(--tone-ink, #3b2a18); --tint: var(--tone-tint, #b88a4a); }
.card .c-art svg { width: 100%; height: 100%; }
.card .c-math { flex: 1; display: grid; place-items: center; font-size: var(--cm); text-align: center; color: #1d130a; padding: 0 2px; }
.card .c-sub { font-size: 11px; font-style: italic; color: var(--ink-soft); }
.bench .card:hover { transform: translateY(-4px); }
.card.targetable { box-shadow: 0 0 0 2px rgba(230,196,124,.8), 0 6px 14px rgba(0,0,0,.6); cursor: crosshair; }
.card.hint { animation: hintp 1.1s infinite; }
.card.enter { animation: enter .42s cubic-bezier(.2,.9,.3,1.2); }
@keyframes enter { from { transform: translateY(-18px) scale(.85) rotate(-3deg); opacity: 0; } }
.card.retort { background: linear-gradient(180deg, #dfe6e2, #c8d3cf); }
.card.retort .c-math { font-size: calc(var(--cm) - 2px); line-height: 1.1; }
.card.retort .chip { display: inline-block; margin: 1px; padding: 1px 4px 2px; border-radius: 4px; background: rgba(255,255,255,.55); border: 1px solid rgba(40,60,60,.35); cursor: pointer; font-size: calc(var(--cm) - 5px); }
.card.retort .chip:hover { background: #fff; }
.card.retort .chip.targetable { box-shadow: 0 0 0 2px rgba(200,150,60,.9); }
.card.retort .chip.hint { animation: hintp 1.1s infinite; }
.card.calx { width: auto; min-width: var(--cw); max-width: 340px; background: linear-gradient(180deg, #e5c793, #cf9f5c); padding: 6px 12px; }
.card.calx .c-math { font-size: calc(var(--cm) + 1px); }
.card.calx::after { content: ''; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 26px rgba(90,40,10,.45); pointer-events: none; }
.card.fresh-burn { animation: burn .7s ease-out; }
@keyframes burn { 0% { filter: brightness(2.2) saturate(0); transform: scale(1.08); } 100% { filter: none; transform: none; } }
.pow-badge { position: absolute; top: -9px; right: -9px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 5px; display: grid; place-items: center; font-family: var(--math); font-weight: 700; font-size: 16px;
  background: #3a2614; color: var(--brass-hi); border: 1.5px solid var(--brass); box-shadow: 0 2px 4px rgba(0,0,0,.6); }
.empty-bench { font-style: italic; color: var(--smoke); font-size: 18px; }

/* ---------- ledger strip ---------- */
.ledger { position: absolute; left: 170px; top: 504px; width: 844px; min-height: 60px; padding: 8px 18px; z-index: 9; color: var(--ink);
  background: linear-gradient(180deg, #efe3c6, #e2d1ab); box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 20px rgba(120,80,30,.2); transform: rotate(.35deg);
  display: flex; align-items: center; gap: 12px; overflow: hidden; padding-right: 8px; }
.ledger .lg-scroll { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.explain-btn { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 6px; font-size: 14px; line-height: 1.1; text-align: left;
  color: #f3e4c4; background: linear-gradient(180deg, #2f5a8f, #1f3d63); border: 1px solid #6f9bd1; box-shadow: 0 2px 5px rgba(0,0,0,.35); transition: transform .12s; }
.explain-btn svg { width: 30px; height: 24px; color: #dfe9f7; --tint: #9cc0ea; }
.explain-btn:hover { transform: translateY(-2px); }
.explain-btn.idle { filter: saturate(.3); opacity: .6; }
.ledger .lab { font-family: var(--serif-sc); color: var(--ink-soft); font-size: 13px; flex: none; }
.ledger .m { font-size: 21px; }
.ledger .eq { font-family: var(--math); font-size: 22px; color: var(--ink-soft); }
.status { position: absolute; left: 170px; top: 474px; width: 844px; height: 24px; text-align: center; font-style: italic; font-size: 16px; color: #cdb88f; z-index: 9; text-shadow: 0 1px 2px #000; }

/* ---------- balance ---------- */
.scale-wrap { position: absolute; right: 14px; top: 176px; width: 228px; height: 300px; z-index: 8; text-align: center; }
.scale-wrap svg { width: 228px; height: 236px; overflow: visible; }
.scale-wrap .beam { transition: transform 1.1s cubic-bezier(.3,1.6,.5,1); transform-origin: 114px 58px; }
.scale-wrap .pan { transition: transform 1.1s cubic-bezier(.3,1.6,.5,1); }
.scale-read { font-size: 15px; color: var(--smoke); line-height: 1.35; margin-top: -8px; }
.scale-read .me { color: #8fc9b4; } .scale-read .him { color: #e28a70; }
.scale-read .dz { font-family: var(--serif-sc); color: var(--text-lit); font-size: 16px; }
.bell { position: absolute; right: 56px; top: 482px; width: 132px; z-index: 10; text-align: center; color: var(--text-lit); font-size: 15px; }
.bell svg { width: 80px; display: block; margin: 0 auto 2px; transition: transform .1s; }
.bell:hover svg { transform: translateY(-2px); }
.bell.ring svg { animation: ring .5s; }
@keyframes ring { 20% { transform: rotate(-9deg) } 45% { transform: rotate(7deg) } 70% { transform: rotate(-4deg) } }
.bell[disabled] { opacity: .35; cursor: default; }

/* ---------- hearth, hand, piles ---------- */
.hearth { position: absolute; left: 16px; top: 612px; width: 262px; z-index: 10; }
.hearth .lab, .piles .lab { font-size: 15px; color: var(--smoke); margin-bottom: 4px; }
.hearth .lab b, .piles .lab b { color: var(--text-lit); font-weight: normal; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 8px; border-radius: 10px; background: linear-gradient(180deg, #120b07, #24150c); border: 1px solid #4a2c18; box-shadow: inset 0 4px 12px rgba(0,0,0,.8), 0 0 30px rgba(240,138,44,var(--glow,0)); }
.slot { height: 50px; border-radius: 6px; background: rgba(0,0,0,.3); display: grid; place-items: center; }
.slot svg { width: 48px; height: 36px; }
.slot .ember { animation: ember 1.6s infinite alternate; }
@keyframes ember { from { opacity: .55 } to { opacity: 1 } }
.slot.spend { animation: spend .6s forwards; }
@keyframes spend { to { transform: scale(.4); opacity: 0; filter: brightness(3); } }
.hand { position: absolute; left: 292px; top: 600px; width: 696px; height: 200px; z-index: 12; display: flex; justify-content: center; align-items: flex-start; }
.hcard { --cw: 122px; --ch: 172px; width: var(--cw); height: var(--ch); margin: 0 -6px; transform-origin: 50% 120%; flex: none; }
.hcard .c-name { font-size: 12.5px; min-height: 26px; display: grid; place-items: center; }
.hcard .c-art { height: 38px; }
.hcard .c-rule { font-size: 11.5px; line-height: 1.28; text-align: center; color: #3a2a18; padding: 0 4px; flex: 1; display: flex; align-items: center; justify-content: center; }
.hcard .c-rule > div { width: 100%; }
.hcard .c-rule .m { font-size: 12.5px; white-space: normal; }
.hcard .c-tech { font-size: 11px; font-style: italic; color: var(--ink-soft); }
.hcard .cost { position: absolute; top: -10px; right: -8px; display: flex; gap: 2px; padding: 2px 5px; border-radius: 11px; background: #1e140c; border: 1px solid #6b4a24; }
.hcard .cost i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f08a2c, #5a200c 70%); display: block; }
.hcard .cost.free { color: var(--brass-hi); font-size: 11px; font-style: italic; padding: 1px 7px; }
.hcard .yld { position: absolute; bottom: -9px; left: -7px; padding: 1px 7px; border-radius: 10px; background: #1e2a24; color: #a6dcc6; border: 1px solid #4f8e79; font-size: 12px; }
.hcard .doses { position: absolute; top: -9px; left: -7px; display: flex; gap: 2px; padding: 3px 5px; border-radius: 10px; background: #1e140c; border: 1px solid #6b4a24; }
.hcard .doses i { width: 7px; height: 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7cc0b0; display: block; }
.hcard .doses i.used { background: #3a2f28; }
.hcard .marks { position: absolute; top: 24px; left: -6px; display: flex; flex-direction: column; gap: 2px; }
.hcard .marks span { font-size: 10px; background: #3a2614; color: var(--brass-hi); border: 1px solid var(--brass); border-radius: 8px; padding: 0 5px; }
.hand .hcard:hover { transform: translateY(-26px) rotate(0deg) !important; z-index: 5; }
.hcard.sel { transform: translateY(-38px) rotate(0) !important; box-shadow: 0 0 0 2px var(--brass-hi), 0 0 26px rgba(230,196,124,.5), 0 12px 20px rgba(0,0,0,.6); z-index: 6; }
.hcard.poor { filter: saturate(.4) brightness(.8); }
.hcard.hint { animation: hintp 1.1s infinite; }
.piles { position: absolute; right: 16px; top: 606px; width: 262px; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pile { height: 128px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-lit); font-size: 15px; line-height: 1.2;
  background: rgba(0,0,0,.25); border: 1px solid rgba(179,139,70,.25); }
.pile svg { width: 64px; height: 50px; --tint: #7a5230; color: #d9c7a4; }
.pile small { color: var(--smoke); font-size: 13px; }
.pile.ready { border-color: var(--brass-hi); animation: hintp 1.3s infinite; }
.pile[disabled] { opacity: .45; cursor: default; }
.piles .spent { grid-column: 1 / -1; text-align: center; font-size: 13px; color: var(--smoke); margin-top: -4px; }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; z-index: 90; display: none; place-items: center; background: rgba(8,5,3,.62); }
#modal.on { display: grid; }
.sheet { position: relative; min-width: 460px; max-width: 900px; max-height: 720px; overflow: auto; padding: 26px 34px 28px; background: var(--parchment); color: var(--ink); border-radius: 4px;
  box-shadow: 0 20px 50px rgba(0,0,0,.8), inset 0 0 40px rgba(120,80,30,.3); animation: sheet .35s ease-out; }
@keyframes sheet { from { transform: translateY(20px) rotate(-1deg); opacity: 0; } }
.sheet h2 { font-family: var(--serif-sc); font-weight: normal; font-size: 30px; margin: 0 0 6px; line-height: 1.1; }
.sheet p { font-size: 17.5px; line-height: 1.45; margin: 8px 0; max-width: 62ch; }
.sheet .m { font-size: 24px; }

<body>
<div id="viewport"><div id="stage">

</div></div>
<script>
/* ================================================================
   ALGEBRICK — algebra engine
   A side of an equation is a list of parts:
     term  c·k      k is '1', 'x', 'x2', 'y' or 'b'  (a pile of bricks)
     root  c·√n     n square-free                       (a root brick)
     group c·(f1)(f2)…                                  (a crate / a frame)
   An equation is {L, R, rel}; a problem state holds one or more
   equations ("or" branches) plus, for graphing, a baseplate grid.
   ================================================================ */
const Alg = (() => {
  // ---------- rationals ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }
  function R(n, d) {
    if (typeof n === 'object') return n;
    if (d === undefined) d = 1;
    if (d < 0) { n = -n; d = -d; }
    if (n === 0) return { n: 0, d: 1 };
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  const ZERO = R(0), ONE = R(1);
  const radd = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const rsub = (a, b) => R(a.n * b.d - b.n * a.d, a.d * b.d);
  const rmul = (a, b) => R(a.n * b.n, a.d * b.d);
  const rdiv = (a, b) => R(a.n * b.d, a.d * b.n);
  const rneg = a => R(-a.n, a.d);
  const rabs = a => R(Math.abs(a.n), a.d);
  const req = (a, b) => a.n === b.n && a.d === b.d;
  const isInt = a => a.d === 1;
  const isZero = a => a.n === 0;
  const rnum = a => a.n / a.d;
  const rstr = a => a.d === 1 ? `${a.n}` : `${a.n}/${a.d}`;
  function rpow(a, k) { let r = ONE; for (let i = 0; i < k; i++) r = rmul(r, a); return r; }
  function isqrtInt(k) { if (k < 0) return null; const s = Math.round(Math.sqrt(k)); return s * s === k ? s : null; }
  function sqrtR(r) { if (r.n < 0) return null; const a = isqrtInt(r.n), b = isqrtInt(r.d); return (a !== null && b !== null) ? R(a, b) : null; }
  // k = m²·n with n square-free (k a positive integer)
  function splitRoot(k) { let m = 1, n = k; for (let f = 2; f * f <= n; f++) while (n % (f * f) === 0) { n /= f * f; m *= f; } return { m, n }; }

  // ---------- ids ----------
  let _id = 1;
  const nid = p => `${p}${_id++}`;
  const clone = s => JSON.parse(JSON.stringify(s));

  // ---------- monomial keys ----------
  const ORDER = { x2: 0, x: 1, y: 2, b: 3, '1': 4 };
  const varOf = k => k === '1' ? null : k[0];
  const powOf = k => k === '1' ? 0 : (k.length > 1 ? +k.slice(1) : 1);
  const mkKey = (v, p) => p === 0 ? '1' : (p === 1 ? v : v + p);
  function mulKey(a, b) { if (a === '1') return b; if (b === '1') return a; if (varOf(a) !== varOf(b)) return null; return mkKey(varOf(a), powOf(a) + powOf(b)); }

  // ---------- polynomials: {key: rational} ----------
  function pn(o) { const r = {}; for (const k of Object.keys(o)) { const v = R(o[k]); if (v.n) r[k] = v; } return r; }
  function padd(a, b) { const r = { ...a }; for (const k in b) r[k] = radd(r[k] || ZERO, b[k]); return pn(r); }
  function pscale(a, c) { const r = {}; for (const k in a) r[k] = rmul(a[k], c); return pn(r); }
  function pmul(a, b) { const r = {}; for (const i in a) for (const j in b) { const k = mulKey(i, j); if (!k) throw new Error('mixed variables'); r[k] = radd(r[k] || ZERO, rmul(a[i], b[j])); } return pn(r); }
  const pzero = a => Object.keys(a).length === 0;
  const peq = (a, b) => pzero(padd(a, pscale(b, R(-1))));
  const pkeys = p => Object.keys(p).sort((a, b) => ORDER[a] - ORDER[b]);
  const pc = (p, k) => p[k] || ZERO;
  function pdegIn(p, v) { let d = 0; for (const k in p) if (varOf(k) === v) d = Math.max(d, powOf(k)); return d; }
  function pevalNum(p, env) { let s = 0; for (const k in p) { const v = varOf(k); s += rnum(p[k]) * (v ? Math.pow(env[v], powOf(k)) : 1); } return s; }
  const hasVarP = (p, v) => Object.keys(p).some(k => varOf(k) === v);

  // ---------- parts ----------
  const term = (c, k) => ({ t: 'term', id: nid('t'), c: R(c), k });
  const root = (c, n) => ({ t: 'root', id: nid('r'), c: R(c), n });
  const group = (c, f) => ({ t: 'group', id: nid('g'), c: R(c), f: f.map(pn) });
  function partPoly(p) { if (p.t === 'term') return pn({ [p.k]: p.c }); if (p.t === 'group') return p.f.reduce((a, f) => pmul(a, f), pn({ '1': p.c })); return {}; }
  const sidePoly = s => s.reduce((a, p) => padd(a, partPoly(p)), {});
  function sideRoots(s) { const m = {}; for (const p of s) if (p.t === 'root') m[p.n] = radd(m[p.n] || ZERO, p.c); for (const k in m) if (!m[k].n) delete m[k]; return m; }
  function sideNum(s, env) { return pevalNum(sidePoly(s), env) + Object.entries(sideRoots(s)).reduce((a, [n, c]) => a + rnum(c) * Math.sqrt(+n), 0); }
  const termsOf = p => pkeys(p).map(k => term(p[k], k));
  const hasVar = (s, v) => s.some(p => p.t !== 'root' && hasVarP(partPoly(p), v));
  const isZeroSide = s => pzero(sidePoly(s)) && !Object.keys(sideRoots(s)).length;
  const bucketOf = p => p.t === 'term' ? p.k : (p.t === 'root' ? 'r' + p.n : null);
  function snapped(s) { const seen = new Set(); for (const p of s) { if (p.t === 'group') continue; if (isZero(p.c)) return false; const k = bucketOf(p); if (seen.has(k)) return false; seen.add(k); } return true; }
  function sortSide(s) {
    const rank = p => p.t === 'group' ? -1 : p.t === 'root' ? 9 : ORDER[p.k];
    return s.map((p, i) => [p, i]).sort((a, b) => (rank(a[0]) - rank(b[0])) || (a[1] - b[1])).map(x => x[0]);
  }
  const negPart = p => p.t === 'term' ? term(rneg(p.c), p.k) : p.t === 'root' ? root(rneg(p.c), p.n) : group(rneg(p.c), p.f);
  const eqn = (L, Rs, rel = '=') => ({ id: nid('e'), L, R: Rs, rel });
  function findPart(st, pid) { for (const e of st.eqs) for (const s of ['L', 'R']) { if (!e[s]) continue; const i = e[s].findIndex(p => p.id === pid); if (i >= 0) return { e, s, i, part: e[s][i] }; } return null; }
  const findEq = (st, eid) => st.eqs.find(e => e.id === eid);
  const other = s => s === 'L' ? 'R' : 'L';
  const FLIP = { '<': '>', '>': '<', '<=': '>=', '>=': '<=', '=': '=' };
  const ok = (st, extra = {}) => ({ ok: true, st, ...extra });
  const no = msg => ({ ok: false, msg });

  // ---------- is this equation solved for v? ----------
  function solvedSide(e, v) {
    if (!e.R) return null;
    for (const s of ['L', 'R']) {
      const a = e[s], b = e[other(s)];
      if (a.length === 1 && a[0].t === 'term' && a[0].k === v && req(a[0].c, ONE) && !hasVar(b, v) && !b.some(p => p.t === 'group') && snapped(b)) return s;
    }
    return null;
  }
  const isSolved = (e, v) => solvedSide(e, v) !== null;

  // ---------- factoring a polynomial in v (integer coefficients) ----------
  function factorPoly(poly, v) {
    const k2 = mkKey(v, 2);
    if (Object.keys(poly).some(k => ![k2, v, '1'].includes(k))) return null;
    const a = pc(poly, k2), b = pc(poly, v), c = pc(poly, '1');
    if (![a, b, c].every(isInt)) return null;
    let g = [a, b, c].filter(r => r.n).reduce((acc, r) => acc ? gcd(acc, r.n) : Math.abs(r.n), 0);
    if (!g) return null;
    const lead = a.n ? a : b.n ? b : c;
    if (lead.n < 0) g = -g;
    const A = a.n / g, B = b.n / g, C = c.n / g;
    const res = { g: R(g), A, B, C, f: [], kind: '' };
    if (A === 0) {
      if (B === 0 || Math.abs(g) === 1) return null;
      res.f = [pn({ [v]: B, '1': C })]; res.kind = 'gcf'; return res;
    }
    if (C === 0) {
      if (B === 0) return null;
      res.f = [pn({ [v]: 1 }), pn({ [v]: A, '1': B })]; res.kind = 'gcfx'; return res;
    }
    const D = B * B - 4 * A * C; const s = isqrtInt(D);
    if (s === null) {
      if (Math.abs(g) === 1) return null;
      res.f = [pn({ [k2]: A, [v]: B, '1': C })]; res.kind = 'gcf'; return res;
    }
    const mk = r => pn({ [v]: r.d, '1': -r.n });
    const f1 = mk(R(-B - s, 2 * A)), f2 = mk(R(-B + s, 2 * A));
    const prod = pmul(f1, f2);
    res.g = rmul(R(g), rdiv(R(A), prod[k2]));
    res.f = [f1, f2];
    res.kind = s === 0 ? 'square' : (B === 0 ? 'diffsq' : 'trinomial');
    res.pair = [(B + s) / 2, (B - s) / 2]; res.ac = A * C;
    return res;
  }
  function fullyFactored(side, v) {
    if (side.length !== 1 || side[0].t !== 'group' || !isInt(side[0].c)) return false;
    for (const f of side[0].f) {
      const ks = Object.values(f);
      if (!ks.every(isInt)) return false;
      if (Object.keys(f).length > 1 && ks.reduce((acc, r) => gcd(acc, r.n), 0) !== 1) return false;
      if (pdegIn(f, v) === 2) { const fp = factorPoly(f, v); if (fp && fp.kind !== 'gcf') return false; }
    }
    return true;
  }

  // ================= operations =================
  // Snap: combine like bricks on both sides (zero pairs vanish)
  function opSnap(st0, eid) {
    const st = clone(st0); const e = findEq(st, eid) || st.eqs[0];
    if (!e) return no('Nothing on the bench to snap.');
    const info = { eid: e.id, sides: {} }; let changed = false;
    for (const s of ['L', 'R']) {
      if (!e[s]) continue;
      const out = e[s].filter(p => p.t === 'group');
      const buckets = new Map();
      for (const p of e[s]) { if (p.t === 'group') continue; const k = bucketOf(p); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(p); }
      const merges = [];
      for (const list of buckets.values()) {
        const tot = list.reduce((a, p) => radd(a, p.c), ZERO);
        let np = null;
        if (!isZero(tot)) { np = list.length === 1 ? list[0] : (list[0].t === 'term' ? term(tot, list[0].k) : root(tot, list[0].n)); out.push(np); }
        if (list.length > 1 || isZero(tot)) { changed = true; merges.push({ from: list.map(p => ({ id: p.id, c: p.c })), tot, t: list[0].t, k: list[0].k, n: list[0].n, to: np ? np.id : null }); }
      }
      e[s] = sortSide(out);
      info.sides[s] = merges;
    }
    if (!changed) return no('Nothing to snap. Each side already has at most one pile of each shape.');
    return ok(st, info);
  }
  // Counterweight: take a part off one side by adding its opposite to both sides
  function opCounter(st0, pid) {
    const st = clone(st0); const loc = findPart(st, pid);
    if (!loc) return no('Click one of the brick cards on a plate.');
    const e = loc.e;
    if (!e.R) return no('There is only one plate here. A counterweight balances an equation, so it needs two sides.');
    if (loc.part.t === 'group') return no('That is a boxed group. Unbox it first, then move the pieces one at a time.');
    const [p] = e[loc.s].splice(loc.i, 1);
    const q = negPart(p); e[other(loc.s)].push(q);
    return ok(st, { eid: e.id, part: p, added: q, from: loc.s });
  }
  // Saw: divide both sides by the number in front of a variable brick (or a group)
  function opSaw(st0, pid) {
    const st = clone(st0); const loc = findPart(st, pid);
    if (!loc) return no('Click the variable brick whose number you want to saw off.');
    const e = loc.e, p = loc.part;
    if (!e.R) return no('There is only one plate. The saw splits both sides of an equation into equal parts.');
    if (p.t === 'root' || (p.t === 'term' && p.k === '1')) return no('Saw by the number in front of a variable brick (like the 3 in 3x), not by a loose number.');
    const c = p.c;
    if (req(c, ONE)) return no('That brick already stands alone, with nothing in front of it to saw off.');
    for (const s of ['L', 'R']) e[s] = e[s].map(q => ({ ...q, c: rdiv(q.c, c) }));
    const flipped = c.n < 0 && e.rel !== '=';
    const relBefore = e.rel;
    if (flipped) e.rel = FLIP[e.rel];
    return ok(st, { eid: e.id, part: p, div: c, flipped, relBefore });
  }
  // Unbox: distribute a group into separate terms
  function opUnbox(st0, pid) {
    const st = clone(st0); const loc = findPart(st, pid);
    if (!loc) return no('Click a boxed group, like 3(x + 2).');
    const p = loc.part;
    if (p.t !== 'group') return no('Nothing to unbox. Unbox opens a group in brackets, like 3(x + 2).');
    const ts = termsOf(partPoly(p));
    loc.e[loc.s].splice(loc.i, 1, ...ts);
    return ok(st, { eid: loc.e.id, side: loc.s, group: p, terms: ts });
  }
  // Rectangle: factor one side
  function opFactor(st0, eid, side) {
    const st = clone(st0); const e = findEq(st, eid) || st.eqs[0];
    if (!e) return no('Nothing to factor.');
    let s = side || (!e.L.length && e.R && e.R.length ? 'R' : 'L');
    if (e.R && isZeroSide(e[s]) && !isZeroSide(e[other(s)])) s = other(s);
    const parts = e[s];
    if (!parts.length) return no('That plate is empty.');
    if (parts.some(p => p.t === 'group')) return no('This side is already in a box. If you want to start over, unbox it first.');
    if (parts.some(p => p.t === 'root')) return no('Root bricks can’t go into a rectangle.');
    if (!snapped(parts)) return no('Snap the like bricks together first, so there is one pile of each shape.');
    const v = st.target || 'x';
    const r = factorPoly(sidePoly(parts), v);
    if (!r) return no('These bricks won’t make a rectangle with whole-number sides: this doesn’t factor over the integers. Completing the square or the Master Formula will still work.');
    const g = group(r.g, r.f);
    e[s] = [g];
    return ok(st, { eid: e.id, side: s, before: parts, ...r, group: g });
  }
  // Pry bar: zero-product property
  function opZero(st0, eid) {
    const st = clone(st0); const e = findEq(st, eid) || st.eqs[0];
    if (!e || !e.R) return no('The pry bar needs an equation with 0 on one side.');
    if (e.rel !== '=') return no('The zero-product idea only works for equations (=), not inequalities.');
    let s = null;
    if (isZeroSide(e.R) && !isZeroSide(e.L)) s = 'L'; else if (isZeroSide(e.L) && !isZeroSide(e.R)) s = 'R';
    if (!s) return no('One side must be 0 before you can pry a product apart. Move everything to one side first.');
    const ps = e[s];
    if (ps.length !== 1 || ps[0].t !== 'group' || ps[0].f.length < 2) return no('The other side must be a single product of pieces, like (x − 2)(x + 5). Factor it with the Rectangle first.');
    const g = ps[0]; const v = st.target || 'x';
    const uniq = [];
    for (const f of g.f) if (hasVarP(f, v) && !uniq.some(u => peq(u, f))) uniq.push(f);
    const branches = uniq.map(f => s === 'L' ? eqn(termsOf(f), [], '=') : eqn([], termsOf(f), '='));
    st.eqs.splice(st.eqs.indexOf(e), 1, ...branches);
    return ok(st, { eid: e.id, group: g, factors: uniq, branches: branches.map(b => b.id) });
  }
  // Square-root cutter: square = number  →  base = ±√number
  function opRoot(st0, eid) {
    const st = clone(st0); const e = findEq(st, eid) || st.eqs[0];
    if (!e || !e.R) return no('The cutter works on an equation: a square on one side, a number on the other.');
    if (e.rel !== '=') return no('The square-root cutter only works on equations (=).');
    const v = st.target || 'x';
    let s = null, base = null;
    for (const side of ['L', 'R']) {

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- storage (per-viewer conveniences only) ----------
const Store = {
  get(k, d) { try { let v = localStorage.getItem(k); if (v === null) v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// ---------- sound ----------
const Sound = (() => {
  let ctx = null; let muted = Store.get('algebrick-muted', false);
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(f, dur, type = 'sine', gain = .2, when = 0) {
    const a = ac(); if (!a || muted) return; const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, gain = .15, freq = 1200, q = 1, when = 0) {
    const a = ac(); if (!a || muted) return; const t = a.currentTime + when;
    const len = Math.floor(a.sampleRate * dur); const buf = a.createBuffer(1, len, a.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf; const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = a.createGain(); g.gain.value = gain; s.connect(bp).connect(g).connect(a.destination); s.start(t);
  }
  return {
    bell() { tone(1318, 1.7, 'sine', .16); tone(1976, 1.1, 'sine', .06); tone(659, 1.9, 'triangle', .05); },
    thunk() { tone(96, .28, 'sine', .32); noise(.08, .1, 380); },
    tick() { tone(660, .09, 'triangle', .06); },
    flip() { noise(.07, .09, 2600, .8); },
    sizzle() { noise(.55, .07, 4200, .5); tone(180, .3, 'sine', .04); },
    chime() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 1.1, 'sine', .08, i * .09)); },
    crack() { noise(.4, .32, 1900, .5); noise(.2, .2, 5000, 1, .08); tone(70, .5, 'sawtooth', .06); },
    fizzle() { noise(.25, .06, 700, 1.5); tone(220, .2, 'triangle', .04); tone(165, .25, 'triangle', .04, .1); },
    get muted() { return muted; },
    toggle() { muted = !muted; Store.set('algebrick-muted', muted); if (!muted) this.tick(); },
  };
})();

// ---------- names for brick cards ----------
function material(p) {
  const P = (name, sub, tone, lore) => ({ name, sub, tone, lore });
  const neg = p.c && p.c.n < 0;
  if (p.t === 'root') return P('Root brick', 'a square root', neg ? 'neg' : 'root', 'A root brick: a square root that doesn’t come out whole, like √2. Leave it as it is; it’s exact.');
  if (p.t === 'group') {
    if (p.f.length === 1) return P('Crate', 'a number times a group', 'crate', 'A crate: everything inside is multiplied by the number on the lid. Unbox it to distribute.');
    if (p.f.length === 2 && Alg.peq(p.f[0], p.f[1])) return P('Square frame', 'a perfect square', 'crate', 'A square frame: something times itself. The Square-Root Cutter undoes a square.');
    return P('Frame', 'a product', 'crate', 'A frame: a rectangle whose sides are the factors. Unbox multiplies it out; the Pry Bar splits it when it equals 0.');
  }
  const k = p.k;
  if (k === '1') return P(neg ? 'Red studs' : 'Studs', neg ? 'negative ones' : 'ones', neg ? 'neg' : 'one', 'Studs: plain numbers. Each yellow stud is 1, each red stud is −1, and a yellow and a red cancel.');
  if (k === 'x') return P(neg ? 'Red x-bricks' : 'x-bricks', neg ? 'negative x' : 'unknown length x', neg ? 'neg' : 'x', 'An x-brick is a long brick of unknown length x. We never measure it directly; we find it by balancing.');
  if (k === 'x2') return P(neg ? 'Red x² plates' : 'x² plates', 'x times x', neg ? 'neg' : 'x2', 'An x² plate is a square, x long and x wide: x times x.');
  if (k === 'y') return P(neg ? 'Red y-bricks' : 'y-bricks', 'unknown length y', neg ? 'neg' : 'y', 'A y-brick is a second unknown, a different length from x.');
  if (k === 'b') return P('b-brick', 'the y-intercept', neg ? 'neg' : 'b', 'The b-brick is where the line crosses the y-axis. Solve for it.');
  return P('Bricks', '', 'one', '');
}

// ---------- the Master's voice ----------
const Voice = (() => {
  let timer = null, units = [], idx = 0, onDone = null;
  function prep(html) {
    const box = $('#speech'); box.innerHTML = html;
    units = [];
    const walk = node => {
      for (const ch of [...node.childNodes]) {
        if (ch.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const c of ch.textContent) { const s = document.createElement('span'); s.textContent = c; s.style.opacity = 0; frag.appendChild(s); units.push(s); }
          node.replaceChild(frag, ch);
        } else if (ch.nodeType === 1) {
          if (ch.classList.contains('m') || ch.tagName === 'SVG') { ch.style.opacity = 0; units.push(ch); }
          else walk(ch);
        }
      }
    };
    walk(box);
  }
  function say(html, opts = {}) {
    clearInterval(timer); idx = 0;
    const box = $('#speech'); box.className = opts.big ? 'big' : '';
    prep(html);
    const speed = opts.fast ? 6 : 16;
    return new Promise(res => {
      onDone = res;
      timer = setInterval(() => {
        for (let k = 0; k < 2 && idx < units.length; k++) units[idx++].style.opacity = 1;
        if (idx >= units.length) { clearInterval(timer); timer = null; const d = onDone; onDone = null; d && d(); }
      }, speed);
    });
  }
  function finish() { if (!timer) return false; clearInterval(timer); timer = null; units.forEach(u => u.style.opacity = 1); const d = onDone; onDone = null; d && d(); return true; }
  const typing = () => !!timer;
  return { say, finish, typing };
})();
const say = (html, opts) => Voice.say(html, opts);

// blocking conversation: click to advance
let talkWaiter = null;
async function talk(lines, opts = {}) {
  const bl = $('#blocker'); bl.style.display = 'block';
  for (const line of lines) {
    await say(line, opts);
    $('#taphint').style.display = 'block';
    await new Promise(r => { talkWaiter = r; });
    $('#taphint').style.display = 'none';
  }
  talkWaiter = null; bl.style.display = 'none';
}
function blockerClick() {
  if (Voice.typing()) { Voice.finish(); return; }
  if (talkWaiter) { const r = talkWaiter; talkWaiter = null; r(); }
}

function showTip(html, ev) {
  const tip = $('#tip'); tip.innerHTML = html; tip.style.display = 'block';

  let x = (ev.clientX - r.left) / s + 16, y = (ev.clientY - r.top) / s + 14;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > 1270) x -= w + 30; if (y + h > 790) y -= h + 26;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

// ---------- starting a trial ----------
const stateFromSpec = sp => ({ eqs: Alg.clone(sp.eqs), task: sp.task, target: sp.target, method: sp.method, input: sp.input, var: sp.var, grid: Alg.clone(sp.grid), done: false });
function startTrial(spec, ctx) {
  // ctx: { heat, boss:{name, eyewear, twist, phaseIdx, phases}, practice, tutorial, onWin, deck }
  const deck = ctx.deck || G.run.deck;
  const pile = shuffle(deck.map(inst => ({ inst, doses: dosesOf(inst) })));
  const hand = []; const lent = [];
  for (const id of [...new Set(spec.needs)]) {
    const i = pile.findIndex(h => h.inst.id === id);
    if (i >= 0) hand.push(pile.splice(i, 1)[0]);
    else { const inst = mkInst(id); inst.temp = true; hand.push({ inst, doses: dosesOf(inst) }); lent.push(CARDS[id].name); }
  }
  while (hand.length < 3 && pile.length) hand.push(pile.shift());
  TR = {
    spec, st: stateFromSpec(spec), orig: stateFromSpec(spec), hand, bin: pile, discard: [], pins: 2, me: 0, him: 0, turn: 1,
    phase: 'draw', sel: null, freeNext: false, heat: ctx.heat ?? 1, ctx, hint: null, lent, history: [],
  };
  seenCards = new Set();
  buildTrialScene();
  renderTrial();
  Sound.flip();
  let open = ctx.tutorial ? null : `${pick(['Here.', 'Next.', 'Another.', 'This one.'])} ${spec.prompt}: ${M(Tex.specimen(spec))}.`;
  if (ctx.boss && ctx.boss.phaseIdx === 1) open = null;
  if (lent.length) open = (open ? open + ' ' : '') + `You seem to be missing ${lent.join(' and ')}. <em>Borrow mine, this once.</em>`;
  if (open) say(open + ` <em>${pick(LINES.draw)}</em>`);
  if (ctx.tutorial) tutorialStep();
}

    <button class="pile ${drawing ? 'ready' : ''}" data-a="draw-bin" ${drawing ? '' : 'disabled'} data-tip="<b>The brick bin</b><br>Draw a technique card.">${Art.bin}<span>Brick bin</span><small>${t.bin.length} left${t.bin.length ? '' : t.discard.length ? ', reshuffles' : ''}</small></button>
    <button class="pile ${drawing ? 'ready' : ''}" data-a="draw-pin" ${drawing ? '' : 'disabled'} data-tip="<b>Pin jar</b><br>Put one more pin in your tray (4 at most). Cards cost pins.">${Art.pins}<span>Pin jar</span><small>+1 pin</small></button>
    <div class="spent">${t.discard.length} used card${t.discard.length === 1 ? '' : 's'}</div>`;
  $$('#t-bench [data-id]').forEach(el => { if (!seenCards.has(el.dataset.id)) el.classList.add('enter'); });
  seenCards = new Set($$('#t-bench [data-id]').map(el => el.dataset.id));
}

function ledgerMath() {
  const st = TR.st;
  if (st.done) return Tex.answer(st);
  if (st.task === 'eval') return `<i>f</i>(${Tex.snum(st.input)}) = ${Tex.side(st.eqs[0].L)}`;
  if (st.task === 'slope' || st.task === 'graph') {
    const g = st.grid;
    const m = st.task === 'graph' ? Tex.snum(g.goal.m) : (g.m ? Tex.snum(g.m) : '?');
    const b = st.task === 'graph' ? Tex.snum(g.goal.b) : (st.eqs.length && Alg.isSolved(st.eqs[0], 'b') ? Tex.snum(Alg.solvedValue(st.eqs[0], 'b')) : '?');
    let s = `<i>y</i> = <i>mx</i> + <i>b</i>, with <i>m</i> = ${m} and <i>b</i> = ${b}`;
    if (st.eqs.length) s += ` <span class="or">;</span> ${Tex.state(st)}`;
    return s;
  }
  return Tex.state(st);
}

function statusText() {
  const t = TR;
  if (t.phase === 'draw') return 'Draw: a card from the brick bin, or a pin from the jar.';
  if (t.phase === 'master') return 'The Master Builder’s turn.';
  if (t.phase === 'won') return 'Stamped.';
  if (t.phase === 'cracked') return 'The build has toppled.';
  if (t.sel) {
    if (t.sel.type === 'tool') return TOOL[t.sel.id].how + ' <em>(Esc to put it down.)</em>';
    const d = CARDS[t.sel.id];
    const w = { factor: 'click the plate whose bricks should become a rectangle', zero: 'click the equation', root: 'click the equation', complete: 'click the equation', formula: 'click the equation', stairs: TR.st.task === 'graph' ? 'click the Start Brick, or the top of a step' : 'click one of the points', plug: 'click one of the two points', start: 'click a stud on the baseplate' }[t.sel.id];
    return `${d.name}: ${w}. <em>(Esc to put it back.)</em>`;
  }
  return 'Pick up a tool or a card. Ring the bell when your turn is done.';
}

// ---------- the bench ----------
function partTarget(p) {
  const s = TR.sel; if (!s || s.type !== 'tool') return false;
  if (s.id === 'counter') return p.t !== 'group';
  if (s.id === 'saw') return (p.t === 'term' && p.k !== '1' && !Alg.req(p.c, Alg.ONE)) || (p.t === 'group' && !Alg.req(p.c, Alg.ONE));
  if (s.id === 'unbox') return p.t === 'group';
  return false;
}
const plateTarget = ps => TR.sel && TR.sel.type === 'hand' && TR.sel.id === 'factor' && ps.length > 0;
const rowTarget = () => TR.sel && ((TR.sel.type === 'tool' && TR.sel.id === 'snap') || (TR.sel.type === 'hand' && ['zero', 'root', 'complete', 'formula'].includes(TR.sel.id)));

function partCardHTML(p, e, s) {
  const m = material(p); const tone = Art.TONES[m.tone] || Art.TONES.one;
  let art, badge = '';
  if (p.t === 'term') { const pl = Art.pile(p.k, p.c); art = pl.svg; badge = pl.badge; }
  else if (p.t === 'root') art = Art.rootBrick(p.n, p.c.n < 0);
  else art = p.f.length === 1 ? Art.crate() : Art.frame(p.f.length === 2 && Alg.peq(p.f[0], p.f[1]));
  const r = Tex.part(p);
  const cls = ['card', 'brick-card', p.t === 'group' ? 'grp' : '', partTarget(p) ? 'targetable' : '', TR.hint && TR.hint.pid === p.id ? 'hint' : ''].join(' ');
  return `<div class="${cls}" data-a="part" data-id="${p.id}" data-e="${e.id}" data-s="${s}" style="--tone-ink:${tone[0]};--tone-tint:${tone[1]}">
    <div class="c-name">${m.name}</div><div class="c-art">${art}${badge ? `<span class="badge">${M(badge)}</span>` : ''}</div><div class="c-math">${M(r.html)}</div></div>`;
}
function plateHTML(e, s) {
  const ps = e[s];
  const inner = ps.length ? ps.map((p, i) => {
    const neg = p.c.n < 0;
    const sg = i > 0 ? `<span class="sgn">${neg ? '−' : '+'}</span>` : (neg ? '<span class="sgn">−</span>' : '');
    return sg + partCardHTML(p, e, s);
  }).join('') : '<div class="zero" title="An empty plate is zero">0</div>';
  return `<div class="plate ${plateTarget(ps) ? 'targetable' : ''}" data-a="plate" data-e="${e.id}" data-s="${s}">${inner}</div>`;
}
function eqRowHTML(e) {
  const v = TR.st.target || 'x';
  if (!e.R) return `<div class="eqrow single ${rowTarget() ? 'targetable' : ''}" data-a="row" data-e="${e.id}">${plateHTML(e, 'L')}</div>`;
  const solved = Alg.isSolved(e, v);
  const tilt = e.rel === '=' ? '' : (e.rel[0] === '<' ? 'tilt-l' : 'tilt-r');
  return `<div class="eqrow ${solved ? 'solved' : ''} ${rowTarget() ? 'targetable' : ''} ${TR.hint && TR.hint.eid === e.id ? 'hint' : ''}" data-a="row" data-e="${e.id}">${plateHTML(e, 'L')}<div class="rel ${tilt}" title="${e.rel === '=' ? 'Balanced: both sides are equal' : 'An inequality: one side is heavier'}">${Tex.rel(e.rel)}</div>${plateHTML(e, 'R')}</div>`;
}
function benchHTML() {
  const st = TR.st;
  const rows = st.eqs.map(eqRowHTML).join('<div class="or-sep">or</div>');
  if (!st.grid) return `<div class="rows">${rows || '<div class="empty-bench">The bench is bare.</div>'}</div>`;
  return `<div class="gridwrap">${gridSVG()}</div><div class="gridside">${placardHTML()}${rows ? `<div class="rows">${rows}</div>` : ''}</div>`;
}
function placardHTML() {
  const st = TR.st, g = st.grid;
  const slot = (v, name) => v === null ? `<span class="slot q">${name}</span>` : `<span class="slot">${M(Tex.snum(v))}</span>`;
  if (st.task === 'graph') {
    return `<div class="placard"><div class="pl-t">Blueprint</div>${M('<i>y</i> = ' + Tex.lineH(g.goal.m, g.goal.b))}
      <div class="pl-s">start at ${M('<i>b</i> = ' + Tex.snum(g.goal.b))}, then steps of ${M('rise ' + Tex.snum(R2(g.goal.m).rise) + ', run ' + R2(g.goal.m).run)}</div></div>`;
  }
  const b = st.eqs.length && Alg.isSolved(st.eqs[0], 'b') ? Alg.solvedValue(st.eqs[0], 'b') : null;
  return `<div class="placard"><div class="pl-t">The line through both points</div><div class="pl-eq">${M('<i>y</i> =')} ${slot(g.m, 'm')} ${M('<i>x</i> +')} ${slot(b, 'b')}</div>
    <div class="pl-s">${g.m ? 'slope found' : 'm: the slope, rise ÷ run'}${st.eqs.length ? '' : '<br>b: where it crosses the y-axis'}</div></div>`;
}
const R2 = m => ({ rise: Alg.R(m.n), run: m.d });

function gridSVG() {
  const g = TR.st.grid, N = g.size, u = 15, o = N * u + 16, W = 2 * o;
  const X = x => o + x * u, Y = y => o - y * u;
  const sel = TR.sel;
  const studT = sel && sel.type === 'hand' && sel.id === 'start';
  const ptT = sel && sel.type === 'hand' && (sel.id === 'stairs' || sel.id === 'plug');
  const stT = sel && sel.type === 'tool' && sel.id === 'saw' && TR.st.task === 'slope' && !g.m;
  let s = `<svg viewBox="0 0 ${W} ${W}" class="grid" aria-label="Baseplate grid"><rect x="3" y="3" width="${W - 6}" height="${W - 6}" rx="10" class="gp-base"/>`;
  for (let x = -N; x <= N; x++) for (let y = -N; y <= N; y++) s += `<circle cx="${X(x)}" cy="${Y(y)}" r="4.3" class="stud ${studT ? 'tg' : ''}" data-a="stud" data-x="${x}" data-y="${y}"/>`;
  s += `<path d="M${X(-N) - 9} ${Y(0)}H${X(N) + 9}M${X(0)} ${Y(-N) - 9}V${Y(N) + 9}" class="axis"/>`;
  s += `<text x="${X(N) + 6}" y="${Y(0) - 5}" class="axl">x</text><text x="${X(0) + 6}" y="${Y(N) - 2}" class="axl">y</text>`;
  for (const k of [-8, -4, 4, 8]) if (Math.abs(k) <= N) s += `<text x="${X(k)}" y="${Y(0) + 15}" class="tick" text-anchor="middle">${k}</text><text x="${X(0) - 7}" y="${Y(k) + 4}" class="tick" text-anchor="end">${k}</text>`;
  if (g.line) {
    const m = Alg.rnum(g.line.m), b = Alg.rnum(g.line.b);
    const pts = []; for (const x of [-N - .6, N + .6]) pts.push([x, m * x + b]);
    s += `<clipPath id="gclip"><rect x="3" y="3" width="${W - 6}" height="${W - 6}" rx="10"/></clipPath><path d="M${X(pts[0][0])} ${Y(pts[0][1])}L${X(pts[1][0])} ${Y(pts[1][1])}" class="beam" clip-path="url(#gclip)"/>`;
  }
  for (const stp of g.stairs) {
    const x1 = X(stp.from.x), x2 = X(stp.to.x), y1 = Y(stp.from.y), y2 = Y(stp.to.y);
    s += `<g class="stairs ${stT ? 'tg' : ''}" data-a="gstairs"><rect class="hit" x="${Math.min(x1, x2) - 6}" y="${Math.min(y1, y2) - 8}" width="${Math.abs(x2 - x1) + 30}" height="${Math.abs(y2 - y1) + 26}"/><rect x="${Math.min(x1, x2)}" y="${y1 - 4}" width="${Math.abs(x2 - x1)}" height="8" rx="2" class="run"/>
      <rect x="${x2 - 4}" y="${Math.min(y1, y2)}" width="8" height="${Math.abs(y2 - y1)}" rx="2" class="rise ${stp.rise < 0 ? 'down' : ''}"/>
      <text x="${(x1 + x2) / 2}" y="${y1 + (stp.rise >= 0 ? 17 : -9)}" text-anchor="middle" class="stl">run ${stp.run}</text>
      <text x="${x2 + 7}" y="${(y1 + y2) / 2 + 4}" class="stl">rise ${stp.rise < 0 ? '−' + (-stp.rise) : stp.rise}</text></g>`;
    if (TR.st.task === 'graph') s += `<g data-a="gpt" data-p="${stp.id}" class="gpt ${ptT ? 'tg' : ''}"><rect class="hit" x="${x2 - 13}" y="${y2 - 13}" width="26" height="26"/><rect x="${x2 - 7}" y="${y2 - 7}" width="14" height="14" rx="2" class="pb step"/></g>`;
  }
  for (const p of g.pts) s += `<g data-a="gpt" data-p="${p.id}" class="gpt ${ptT ? 'tg' : ''}"><rect class="hit" x="${X(p.x) - 13}" y="${Y(p.y) - 13}" width="26" height="26"/><rect x="${X(p.x) - 7}" y="${Y(p.y) - 7}" width="14" height="14" rx="2" class="pb"/><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" class="pbs"/>
    <text x="${X(p.x) + (p.x > 3 ? -10 : 10)}" y="${Y(p.y) + (p.y > 5 ? 17 : -9)}" class="ptl" text-anchor="${p.x > 3 ? 'end' : 'start'}">(${p.x}, ${p.y})`.replace(/-(\d)/g, '−$1') + '</text></g>';
  if (g.start) s += `<g data-a="gpt" data-p="start" class="gpt ${ptT ? 'tg' : ''}"><rect class="hit" x="${X(0) - 14}" y="${Y(g.start.y) - 14}" width="28" height="28"/><rect x="${X(0) - 8}" y="${Y(g.start.y) - 8}" width="16" height="16" rx="2" class="sb"/><circle cx="${X(0)}" cy="${Y(g.start.y)}" r="3.4" class="sbs"/><text x="${X(0) - 11}" y="${Y(g.start.y) - 9}" class="ptl" text-anchor="end">start (0, ${Tex.text(() => Tex.snum(g.start.y ? Alg.R(g.start.y) : Alg.ZERO)).replace('-', '−')})</text></g>`;
  return s + '</svg>';
}

// ---------- input ----------
function trialClick(a, el) {
  const t = TR; if (!t) return;
  if (a === 'explain') {
    if (!t.history.length) { say('Nothing to explain yet. <em>Make a move first; then I’ll show you why it works.</em>'); return; }
    t.sel = null; renderTrial(); return Explain.open(t.history.length - 1);
  }
  if (a === 'draw-bin' || a === 'draw-pin') return draw(a === 'draw-pin' ? 'pin' : 'bin');
  if (t.phase === 'draw') { say('Draw first. <em>Brick bin or pin jar, bottom right.</em>'); return; }
  if (t.phase !== 'main') return;
  if (a === 'bell') return ringBell();
  if (a === 'ask') return askMaster();
  if (a === 'sweep') return sweepBench();
  if (a === 'tool') {
    const id = el.dataset.t;
    if (id === 'stamp') { t.sel = null; return doTool('stamp', {}); }
    t.sel = (t.sel && t.sel.type === 'tool' && t.sel.id === id) ? null : { type: 'tool', id };
    Sound.tick(); renderTrial(); return;
  }
  if (a === 'hand') {
    const h = t.hand.find(x => x.inst.uid === el.dataset.u); if (!h) return;
    const d = CARDS[h.inst.id];
    const cost = t.freeNext ? 0 : costOf(h.inst);
    if (t.sel && t.sel.type === 'hand' && t.sel.uid === h.inst.uid) { t.sel = null; renderTrial(); return; }
    if (cost > t.pins) { say(`${d.name} takes ${cost} pin${cost > 1 ? 's' : ''}. Your tray has ${t.pins}. <em>Take a pin from the jar next turn, or ring the bell.</em>`); Sound.fizzle(); return; }
    if (!d.target) return playUtility(h);
    if (d.target === 'now') { t.sel = null; return doCard(h.inst.uid, {}); }
    t.sel = { type: 'hand', id: h.inst.id, uid: h.inst.uid }; Sound.flip(); renderTrial(); return;
  }
  if (['part', 'plate', 'row', 'stud', 'gpt', 'gstairs'].includes(a)) {
    const up = k => { const c = el.closest(`[data-${k}]`); return c ? c.dataset[k] : undefined; };
    const tg = { a, pid: el.dataset.id, eid: up('e'), side: up('s'), x: +el.dataset.x, y: +el.dataset.y, pt: el.dataset.p };
    if (!t.sel) return inspect(tg);
    if (t.sel.type === 'tool') return doTool(t.sel.id, tg);
    return doCard(t.sel.uid, tg);
  }
}

function inspect(tg) {
  if (tg.a === 'part') {
    const loc = Alg.findPart(TR.st, tg.pid); if (!loc) return;
    const m = material(loc.part); const r = Tex.part(loc.part);
    return say(`${M((r.neg ? '−' : '') + r.html)}. ${m.lore}`);
  }
  if (tg.a === 'stud') return say(`The stud at ${M(`(${tg.x}, ${tg.y})`.replace(/-/g, '−'))}: ${tg.x} across, ${tg.y} up.`);
  if (tg.a === 'gpt') return say('A brick on the baseplate: a point on the line.');
  if (tg.a === 'gstairs') return say('The staircase: how far up (the rise) for how far across (the run).');
  return say('Pick up a tool from the rack, or a card from your hand, then click here.');
}

function draw(which) {
  const t = TR; if (t.phase !== 'draw') return;
  const binEmpty = !t.bin.length && !t.discard.length;
  if (which === 'pin') {
    if (t.pins >= 4 && !binEmpty) { say('Your tray is full. <em>Four pins at most.</em> Take a card instead.'); return; }
    if (t.pins >= 4) say('Your tray is full and the bin is empty, so there’s nothing to draw. <em>On with it.</em>');
    else { t.pins++; Sound.thunk(); }
  } else {
    if (!t.bin.length) { t.bin = shuffle(t.discard); t.discard = []; }
    if (!t.bin.length && t.pins < 4) { say('The brick bin is empty. <em>Take a pin.</em>'); return; }
    if (t.bin.length) { t.hand.push(t.bin.shift()); Sound.flip(); }
    else say('The bin is empty and your tray is full, so there’s nothing to draw. <em>On with it.</em>');
  }
  t.phase = 'main';
  renderTrial();
  if (t.ctx.tutorial) tutorialStep();
}

function playUtility(h) {
  const t = TR; const id = h.inst.id; const cost = costOf(h.inst);
  if (id === 'pins') { if (t.pins >= 4) { say('Your tray is already full.'); return; } t.pins = Math.min(4, t.pins + 2); say('A handful of spare pins.'); Sound.thunk(); }
  else if (id === 'rummage') { let n = 0; for (let k = 0; k < 2; k++) { if (!t.bin.length) { t.bin = shuffle(t.discard); t.discard = []; } if (t.bin.length) { t.hand.push(t.bin.shift()); n++; } } say(n ? `You rummage and find ${n} more.` : 'Nothing left to find.'); Sound.flip(); }
  else if (id === 'level') { const lift = Math.min(2, t.him); t.him -= lift; say(lift ? 'The bubble settles. I take two bricks off my tower.' : 'My tower is empty. Nothing to level.'); Sound.tick(); }
  else if (id === 'manual') { t.freeNext = true; say('You check the instructions. <em>Your next card this turn costs no pins.</em>'); Sound.chime(); }
  t.pins -= cost; spendDose(h); t.sel = null; renderTrial();
}
function spendDose(h) {
  h.doses--;
  if (h.doses <= 0) { const i = TR.hand.indexOf(h); if (i >= 0) TR.hand.splice(i, 1); if (!h.inst.temp) { h.doses = dosesOf(h.inst); TR.discard.push(h); } }
}
function nudge(msg) { say(msg); Sound.tick(); }

// ---------- moves ----------
function doTool(id, tg) {
  const t = TR, st = t.st; let res, act = id;
  const eid = tg.eid || (st.eqs[0] && st.eqs[0].id);
  if (id === 'snap') { if (!st.eqs.length) return nudge('There is no equation to snap yet.'); res = Alg.opSnap(st, eid); }
  else if (id === 'counter') { if (!tg.pid) return nudge('Click a brick card itself, not the empty plate.'); res = Alg.opCounter(st, tg.pid); }
  else if (id === 'saw') {
    if (tg.a === 'gstairs' || (st.grid && st.task === 'slope' && !st.grid.m && !tg.pid)) { act = 'sawstairs'; res = Alg.opSawStairs(st); }
    else { if (!tg.pid) return nudge('Click the variable brick whose number you want to saw off.'); res = Alg.opSaw(st, tg.pid); }
  }
  else if (id === 'unbox') { if (!tg.pid) return nudge('Click a crate or a frame card.'); res = Alg.opUnbox(st, tg.pid); }
  else if (id === 'stamp') res = Alg.opStamp(st);
  if (!res.ok) return misapply(res.msg);
  commit(act, res, tg, TOOL[id].yld, null);
}
function doCard(uid, tg) {
  const t = TR; const h = t.hand.find(x => x.inst.uid === uid); if (!h) return;
  const id = h.inst.id, st = t.st; const eid = tg.eid || (st.eqs[0] && st.eqs[0].id);
  let res;
  switch (id) {
    case 'factor': res = Alg.opFactor(st, eid, tg.side); if (res.ok && res.pair) return factorQuiz(h, res, tg); break;
    case 'zero': res = Alg.opZero(st, eid); break;
    case 'root': res = Alg.opRoot(st, eid); break;
    case 'complete': res = Alg.opComplete(st, eid); break;
    case 'formula': res = Alg.opFormula(st, eid); break;
    case 'swap': res = Alg.opSwap(st); break;
    case 'stairs':
      if (st.task === 'graph' && tg.a !== 'gpt') return nudge('Click the Start Brick, or the top brick of a step, to build a staircase from it.');
      res = Alg.opStairs(st, tg.pt); break;
    case 'plug': if (tg.a !== 'gpt') return nudge('Click one of the two points on the baseplate.'); res = Alg.opPlug(st, tg.pt); break;
    case 'start': if (tg.a !== 'stud') return nudge('Click a stud on the baseplate.'); res = Alg.opStart(st, tg.x, tg.y); break;
    default: return;
  }
  if (!res.ok) return misapply(res.msg);
  commit(id, res, tg, yieldOf(h.inst), h);
}
function commit(act, res, tg, yld, h) {
  const t = TR;
  Explain.record(act, t.st, res, tg);
  t.st = res.st; t.hint = null; t.sel = null;
  if (h) { if (!t.freeNext) t.pins -= costOf(h.inst); t.freeNext = false; spendDose(h); }
  if (yld) gain(yld);
  if (act === 'stamp') { Sound.chime(); return win(); }
  Sound.flip();
  after(lineFor(act, res));
}
function lineFor(act, res) {
  switch (act) {
    case 'snap': return Object.values(res.sides).some(ms => ms.some(m => !m.to)) ? 'Click. A red and a matching brick cancel to nothing.' : 'Click. Like bricks, one pile.';
    case 'counter': return 'A counterweight on both plates. Still balanced.';
    case 'saw': return res.flipped ? `Sawn by ${M(Tex.snum(res.div))}. <em>A negative: the beam tips the other way, and the sign flips.</em>` : `Sawn into ${Math.abs(res.div.n) > 1 && res.div.d === 1 ? Math.abs(res.div.n) + ' equal groups' : 'equal parts'}.`;
    case 'unbox': return 'Unboxed. Everything inside is multiplied out.';
    case 'factor': return 'The bricks make a rectangle.';
    case 'zero': return `Pried apart. ${res.factors.length > 1 ? 'Two branches: either piece can be the zero.' : 'One piece must be zero.'}`;
    case 'root': return res.sq && Alg.isZero(res.sq) ? 'Cut.' : 'Cut. <em>Plus or minus: a negative squares to the same number.</em>';
    case 'complete': return 'The corner is filled. A perfect square.';
    case 'formula': return 'The Master Formula speaks.';
    case 'swap': return 'Every x-brick swapped for the number.';
    case 'stairs': return 'Steps built.';
    case 'sawstairs': return `Rise ÷ run: the slope is ${M(Tex.snum(res.m))}.`;
    case 'plug': return 'Plugged in. Now solve for b.';
    case 'start': return 'The start brick is down.';
  }
  return '';
}
function after(line) {
  renderTrial();
  if (TR.ctx.tutorial) {
    if (TR.history.length === 1) { say(line + ' <em>Whenever you want to know why a move works, press <b>Explain</b> on the right end of the ledger. It’s free.</em>'); setTimeout(() => { if (TR && TR.phase === 'main') tutorialStep(); }, 4200); return; }
    say(line); setTimeout(() => { if (TR && TR.phase === 'main') tutorialStep(); }, 1300); return;
  }
  if (line) say(line);
}
function gain(n) { if (!n) return; TR.me += n; Sound.thunk(); }

function misapply(msg) {
  const t = TR; Sound.fizzle();
  const free = t.ctx.tutorial;
  if (!free) t.him += 1;
  say(`<em>${pick(LINES.no)}</em> ${msg}${free ? '' : ' <em>A brick for my tower.</em>'}`);
  renderTrial(); checkCrack();
}

// ---------- the Rectangle puzzle ----------
function factorQuiz(h, res, tg) {
  const t = TR; const ac = res.ac, B = res.B, A = res.A, C = res.C;
  const pairs = []; const n = Math.abs(ac);
  for (let d = 1; d * d <= n; d++) if (n % d === 0) { const e = n / d; if (ac > 0) pairs.push([d, e], [-d, -e]); else pairs.push([d, -e], [-d, e]); }
  const key = p => [Math.min(...p), Math.max(...p)].join(',');
  const right = res.pair;
  let opts = shuffle(pairs.filter(p => key(p) !== key(right))).slice(0, 5); opts.push(right);
  // decoys that add to b but multiply to the wrong number: both conditions matter
  const decoys = shuffle(Array.from({ length: 19 }, (_, i) => i - 9).map(d => [d, B - d]).filter(p => p[0] <= p[1] && p[0] * p[1] !== ac && !opts.some(o => key(o) === key(p))));
  opts = shuffle(opts.concat(decoys.slice(0, Math.max(1, 5 - opts.length))));
  const polyH = Tex.poly(Alg.pn({ x2: A, x: B, '1': C }));
  const gcfNote = !Alg.req(Alg.rabs(res.g), Alg.ONE) ? `<p>First the common factor comes out: ${M(Tex.snum(res.g))} goes to the front, leaving ${M(polyH)}.</p>` : '';
  const ask = A === 1 ? `two numbers that multiply to ${M('<i>c</i> = ' + ac)} and add to ${M('<i>b</i> = ' + B)}` : `two numbers that multiply to ${M('<i>a</i> · <i>c</i> = ' + A + ' · ' + C + ' = ' + ac)} and add to ${M('<i>b</i> = ' + B)}`;
  const box = `<table class="boxm quiz"><tr><td class="bx2">${M(A === 1 ? '<i>x</i><sup>2</sup>' : A + '<i>x</i><sup>2</sup>')}</td><td class="bx1">?</td></tr><tr><td class="bx1">?</td><td class="bu">${M(Tex.snum(Alg.R(C)))}</td></tr></table>`;
  const render = (msg) => modal(`<h2>Build the rectangle</h2>${gcfNote}<div class="quizbox">${box}<div><p>To arrange ${M(polyH)} into a rectangle, the middle ${M(B + '<i>x</i>')} has to split into two strips of x-bricks. Find ${ask}.</p>
      <div class="pairs">${opts.map((p, i) => `<button class="btn alt" data-a="mc" data-k="pick" data-i="${i}">${M(`${p[0]} and ${p[1]}`.replace(/-/g, '−'))}</button>`).join('')}</div>${msg ? `<p class="qmsg">${msg}</p>` : ''}</div></div>`, {
      pick: el => {
        const p = opts[+el.dataset.i];
        if (p[0] + p[1] === B && p[0] * p[1] === ac) { closeModal(); commit('factor', res, tg, yieldOf(h.inst), h); return; }
        if (!t.ctx.tutorial && !t.ctx.practice) t.him += 1;
        Sound.fizzle(); renderTrial();
        if (checkCrack()) { closeModal(); return; }
        const pen = t.ctx.tutorial || t.ctx.practice ? '' : ' <em>A brick for my tower.</em>';
        if (p[0] * p[1] !== ac) render(`${M(`${p[0]} + ${p[1]} = ${B}`.replace(/-/g, '−'))}, good, but ${M(`${p[0]} × ${p[1]} = ${p[0] * p[1]}`.replace(/-/g, '−'))}, not ${M(String(ac).replace('-', '−'))}. Both have to work.${pen}`);
        else render(`${M(`${p[0]} × ${p[1]} = ${ac}`.replace(/-/g, '−'))}, good, but ${M(`${p[0]} + ${p[1]} = ${p[0] + p[1]}`.replace(/-/g, '−'))}, not ${M(String(B).replace('-', '−'))}. Both have to work.${pen}`);
      },
      close: () => { closeModal(); t.sel = null; renderTrial(); },
    }, { closable: true, width: 760 });
  render('');
}

// ---------- advice ----------
function hintText(h) {
  const st = TR.st;
  const sideName = s => s === 'L' ? 'left' : 'right';
  const partM = p => { const r = Tex.part(p); return M((r.neg ? '−' : '') + r.html); };
  switch (h.act) {
    case 'snap': return 'Snap. Some like bricks on the same plate should click together.';
    case 'counter': { const loc = Alg.findPart(st, h.pid); const neg = Alg.clone(loc.part); neg.c = Alg.rneg(neg.c); return `Counterweight the ${partM(loc.part)} on the ${sideName(loc.s)}: put ${partM(neg)} on both plates, so it cancels there.`; }
    case 'saw': { const loc = Alg.findPart(st, h.pid); const c = loc.part.c; return `Saw by ${M(Tex.snum(c))}: divide both plates by it.${c.n < 0 && loc.e.rel !== '=' ? ' <em>It’s negative, so the sign will flip.</em>' : ''}`; }
    case 'unbox': { const loc = Alg.findPart(st, h.pid); return `Unbox the ${partM(loc.part)}: multiply out everything inside.`; }
    case 'factor': return 'The Rectangle. Play it on the side with the bricks, and arrange them into a rectangle.';
    case 'zero': return 'One side is 0 and the other is a product. The Pry Bar: one of the pieces must be 0.';
    case 'root': return 'A square alone on one side, a number on the other. The Square-Root Cutter. <em>Don’t forget the ±.</em>';
    case 'complete': return 'The x² plate and the x-bricks are alone together. The Corner Piece finishes the square.';
    case 'formula': return 'Everything is on one side. The Master Formula.';
    case 'swap': return 'Swap Bricks: put the number in for every x.';
    case 'stairs': return st.task === 'graph' ? 'The Staircase, from the Start Brick.' : 'The Staircase, between the two points: count the rise and the run.';
    case 'sawstairs': return 'The Saw, on the staircase: rise ÷ run is the slope.';
    case 'plug': return 'Plug-in: put one of the points into y = mx + b. Then solve for b.';
    case 'start': return `The Start Brick, at ${M('(0, ' + Tex.snum(st.grid.goal.b) + ')')}: where x = 0.`;
    case 'stamp': return 'It’s done. Stamp it.';
  }
  return 'Hm.';
}
function askMaster() {
  const t = TR; t.sel = null; const h = Hint.next(t.st);

  if (!free) t.him += 1;

  t.hint = { act: h.act, pid: h.pid, eid: h.eid, tool: TOOL_ACTS.has(h.act) ? (h.act === 'sawstairs' ? 'saw' : h.act) : null, card: TOOL_ACTS.has(h.act) ? null : h.act };

  say(hintText(h) + extra + (free ? '' : ' <em>Advice costs a brick.</em>'));

}
function sweepBench() {
  const t = TR; if (!t.ctx.tutorial && !t.ctx.practice) t.him += 1;

// ---------- the Master Builder’s turn ----------
async function ringBell() {
  const t = TR; if (t.phase !== 'main') return;
  t.phase = 'master'; t.sel = null; t.freeNext = false;
  const bell = $('#t-bell'); bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring');
  Sound.bell(); renderTrial();

  say(line + (t.heat > 1 ? ` <em>(${t.heat} bricks.)</em>` : ''));

function checkCrack() {

}
async function crack() {
  const c = TR.ctx;
  if (c.practice) {
    await talk(['Your tower topples. Bricks everywhere. <em>No lamps at the practice bench.</em> Again.']);
    return startTrial(TR.spec, c);
  }

  if (G.run.lamps <= 0) return gameOver();
  await talk(['Your tower topples. Bricks everywhere. <em>He switches off one of your lamps.</em>', G.run.lamps === 1 ? 'One lamp left. We’ll try that blueprint again.' : 'Again.']);
  startTrial(TR.spec, c);
}

// ---------- winning ----------
function win() {
  const t = TR; t.phase = 'won'; renderTrial();
  const q = Tex.specimen(t.spec), ans = Tex.answer(t.st);
  Ledger.add(q, ans, t.spec.fam, t.spec.prompt);
  const c = t.ctx;
  const lead = Math.max(0, t.me - t.him);
  const bonus = c.boss ? 3 : 0;
  if (!c.practice && G.run) { G.run.gold += lead + bonus; G.run.solved.push({ q, a: ans }); }
  say(pick(LINES.win));
  const goldLine = c.practice ? '' : `<p style="text-align:center">You finished ${lead} ahead in the tower race: <b>+${lead + bonus} gold</b>${bonus ? ' (with a bonus for the examiner)' : ''}.</p>`;
  const more = c.boss && c.boss.phaseIdx < c.boss.phases.length - 1;
  const btns = c.practice ? `<button class="btn" data-a="mc" data-k="again">Another</button><button class="btn alt" data-a="mc" data-k="fams">Choose a different kind</button><button class="btn alt" data-a="mc" data-k="leave">Leave the bench</button>`
    : `<button class="btn" data-a="mc" data-k="go">${more ? 'The next build' : 'Into the logbook'}</button>`;
  const showWin = () => modal(`<h2>Stamped</h2><div class="win-q">${t.spec.prompt}: ${M(q)}</div><span class="big">${M(ans)}</span>${goldLine}
    <p style="text-align:center"><button class="btn alt" data-a="mc" data-k="walk">${Art.lens.replace('<svg', '<svg style="width:26px;height:20px;vertical-align:-4px;margin-right:6px"')}Walk through all ${t.history.length} steps, with diagrams</button></p><div class="row">${btns}</div>`, {
    walk: () => { Explain.open(0, showWin); },
